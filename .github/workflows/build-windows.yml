name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

# Needed to publish the release below
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm FlowPy.spec

      # Published as a release rather than a build artifact: artifacts count
      # against a 500 MB storage quota and expire, while a release asset is
      # neither, and gives a permanent link that can be sent to a colleague.
      # A tagged push makes that version's release; any other push updates
      # the rolling "latest-windows" one, so there is always a current .exe
      # to download without tagging first.
      - name: Publish the .exe as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-windows' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'FlowPy — latest Windows build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            FlowPy for Windows, built from `${{ github.sha }}`.

            Download `FlowPy.exe` below and double-click it — nothing to install.
            Windows SmartScreen will warn that the publisher is unknown, because
            the executable is not signed by a recognised developer: choose
            **More info → Run anyway**.
          files: dist/FlowPy.exe
          fail_on_unmatched_files: true
